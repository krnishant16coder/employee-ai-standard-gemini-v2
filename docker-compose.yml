services:
  postgres:
    image: postgres:16
    container_name: employee-ai-postgres
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - employee_ai_pgdata:/var/lib/postgresql/data
volumes:
  employee_ai_pgdata:
