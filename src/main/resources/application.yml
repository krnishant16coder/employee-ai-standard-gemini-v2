spring:
  application:
    name: employee-ai-standard
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8080}



gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.5-flash-lite

